repos:
  - repo: local
    hooks:
      - id: sync-shared
        name: Sync shared cookiecutter assets
        entry: poetry run python _scripts/sync_shared.py
        language: system
        pass_filenames: false
        always_run: true
      - id: audit-action-pins
        name: Audit GitHub Action pins
        entry: poetry run python _scripts/audit_action_pins.py
        language: system
        pass_filenames: false
