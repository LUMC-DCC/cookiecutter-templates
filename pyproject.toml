[project]
name = "cookiecutter-templates"
version = "0.1.0"
description = "Service-agnostic Cookiecutter templates for FAIR research software"
authors = [
    {name = "LUMC Digital Competence Center"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[project.urls]
Repository = "https://github.com/LUMC-DCC/cookiecutter-templates"
Documentation = "https://lumc-dcc.github.io/cookiecutter-templates"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.6.14"
mkdocs-awesome-pages-plugin = "^2.10.1"
mkdocs-material-extensions = "^1.3.1"
mkdocs-get-deps = "^0.2.0"
pyyaml = "^6.0.2"
mkdocs = "^1.6.1"
sphinx = ">=8,<9"
myst-parser = ">=4,<5"
sphinx-book-theme = ">=1,<2"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
pytest = "^9.1.1"
cookiecutter = "^2.7.1"
rs-metadata = {git = "https://github.com/LUMC-DCC/rs-metadata.git", rev = "27f3da06c4bae5f735c492608b5ffea6c2715c21"}
ruff = "^0.16.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
