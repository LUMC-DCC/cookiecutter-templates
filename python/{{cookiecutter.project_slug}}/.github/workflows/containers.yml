name: Containers
{% set container_types = namespace(values=[]) -%}
{% for specification in cookiecutter.containerization.entries -%}
{% if specification.type is defined -%}
{% set _ = container_types.values.append(specification.type) -%}
{% endif -%}
{% endfor -%}
{% set has_docker = "Docker" in container_types.values -%}
{% set has_oci = "OCI / Podman" in container_types.values -%}
{% set has_apptainer = "Apptainer / Singularity" in container_types.values -%}
{% set channels = namespace(values=[]) -%}
{% for channel in cookiecutter.distribution_channels.entries -%}
{% set _ = channels.values.append(channel | lower) -%}
{% endfor -%}
{% set publish_ghcr = "github container registry" in channels.values or "ghcr" in channels.values or "ghcr.io" in channels.values -%}
{% set publish_docker_hub = "docker hub" in channels.values or "dockerhub" in channels.values -%}
{% set primary_oci_file = "Dockerfile" if has_docker else "Containerfile" -%}

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
{% if has_docker or has_oci %}
  oci-build:
    name: Build {% raw %}${{ matrix.file }}{% endraw %}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
{% if has_docker %}
          - Dockerfile
{% endif %}
{% if has_oci %}
          - Containerfile
{% endif %}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: {% raw %}${{ matrix.file }}{% endraw %}
          push: false
{% endif %}
{% if has_apptainer %}
  apptainer-build:
    name: Build Apptainer image
    runs-on: ubuntu-latest
    env:
      APPTAINER_VERSION: "1.5.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Apptainer
        run: |
          curl --fail --location --silent --show-error \
            --output apptainer.deb \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          sudo apt-get update
          sudo apt-get install --yes ./apptainer.deb
      - name: Build and test image
        run: |
          apptainer build --fakeroot {{ cookiecutter.project_slug }}.sif Apptainer.def
          apptainer test {{ cookiecutter.project_slug }}.sif
{% endif %}
{% if (has_docker or has_oci) and publish_ghcr %}
  publish-ghcr:
    name: Publish image to GHCR
    if: startsWith(github.ref, 'refs/tags/')
    needs: oci-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: {% raw %}${{ github.actor }}{% endraw %}
          password: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
      - name: Create image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/{% raw %}${{ github.repository }}{% endraw %}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: {{ primary_oci_file }}
          push: true
          tags: {% raw %}${{ steps.meta.outputs.tags }}{% endraw %}
          labels: {% raw %}${{ steps.meta.outputs.labels }}{% endraw %}
{% endif %}
{% if (has_docker or has_oci) and publish_docker_hub %}
  publish-docker-hub:
    name: Publish image to Docker Hub
    if: startsWith(github.ref, 'refs/tags/')
    needs: oci-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: {% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.DOCKERHUB_TOKEN }}{% endraw %}
      - name: Create image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: {% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}/{{ cookiecutter.project_slug | replace('_', '-') }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: {{ primary_oci_file }}
          push: true
          tags: {% raw %}${{ steps.meta.outputs.tags }}{% endraw %}
          labels: {% raw %}${{ steps.meta.outputs.labels }}{% endraw %}
{% endif %}
